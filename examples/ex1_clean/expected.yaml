  - text: Method Z outperforms baseline W by 3.5 percentage points on dataset Q.
    metric: accuracy_gain_pp
    dataset: Q
    baseline: W
    reported_value: 3.5
    reported_unit: percentage_points
    tolerance: 0.01
    source_ref: s3
    testable: true
