plan_raw:
  assumptions:
    - detail: Random seed for training
      value_chosen: "1"
      reason: The paper states a fixed seed of 1 in Section 2, so the reproduction uses it.
      confidence: high
    - detail: Training data subsample for the scaled run
      value_chosen: first 10% of training examples
      reason: The paper does not define a scaled-down split, so the first 10% of training examples is used and logged.
      confidence: medium
  items:
    - claim_id: c1
      steps: [Train method Z on a 10% subsample of dataset Q, Evaluate on the test split]
      scale_factor: 0.1
      scale_reason: Full 5-epoch runs are costly, so a 10% subsample is used.
      config: {batch_size: 32, epochs: 5, learning_rate: 0.02, seed: 1}
    - claim_id: c2
      steps: [Train baseline W on a 10% subsample of dataset Q, Evaluate on the test split]
      scale_factor: 0.1
      scale_reason: The baseline is reproduced at the same 10% scale so the comparison stays fair.
      config: {batch_size: 32, epochs: 5, learning_rate: 0.02, seed: 1}
    - claim_id: c3
      steps: [Compare measured accuracies of Z and W]
      scale_factor: 0.1
      scale_reason: The gap is derived from the two scaled runs above.
      config: {batch_size: 32, epochs: 5, seed: 1}
expected_verdicts:
  - {claim_id: c1, status: partially replicated}
  - {claim_id: c2, status: partially replicated}
  - {claim_id: c3, status: untestable at this scale}
