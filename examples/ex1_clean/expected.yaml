title: Method Z Reaches 85.0% Accuracy on Dataset Q
notes: Clean small paper. All numbers agree between prose and Table 1.
sections:
  - {id: s1, title: Introduction, page: 1}
  - {id: s2, title: Method, page: 1}
  - {id: s3, title: Results, page: 1}
tables:
  - id: t1
    source: text
    page: 1
    caption: Test accuracy on dataset Q.
    rows:
      - [Method, Accuracy (%)]
      - [Z, "85.0"]
      - [W (baseline), "81.5"]
claims_raw:
  - text: Method Z reaches 85.0% accuracy on dataset Q, versus 81.5% for baseline W.
    metric: accuracy
    dataset: Q
    baseline: W
    reported_value: 85.0
    reported_unit: percent
    tolerance: 0.01
    source_ref: t1
    testable: true
  - text: Baseline W reaches 81.5% accuracy on dataset Q.
    metric: accuracy
    dataset: Q
    baseline: null
    reported_value: 81.5
    reported_unit: percent
    tolerance: 0.01
    source_ref: t1
