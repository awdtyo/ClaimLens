plan_raw:
  assumptions:
    - detail: Random seed for training
      value_chosen: "4"
      reason: The paper states a fixed seed of 4 in Section 2, so the reproduction uses it.
      confidence: high
    - detail: Training data subsample for the scaled run
      value_chosen: first 10% of training examples
      reason: The paper does not define a scaled-down split, so the first 10% of training examples is used and logged.
      confidence: medium
  items:
    - claim_id: c1
      steps: [Train method T on a 10% subsample of dataset F, Evaluate on the test split]
      scale_factor: 0.1
      scale_reason: Full 3-epoch runs are costly, so a 10% subsample is used.
      config: {epochs: 3, seed: 4}
    - claim_id: c2
      steps: [Locate dataset E, Evaluate method T on dataset E]
      scale_factor: 1.0
      scale_reason: No reduced scale applies; the dataset is unavailable.
      config: {}
expected_verdicts:
  - {claim_id: c1, status: partially replicated}
  - {claim_id: c2, status: untestable}
